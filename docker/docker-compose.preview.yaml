# Local preview stack for hcr-platform: Postgres + Redis only.
# The api/web services are started from source (pnpm --filter api dev) because
# they have no Dockerfiles. See hcr-platform/docker/README.
name: hcr-preview

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcr
      POSTGRES_PASSWORD: hcrpassword
      POSTGRES_DB: hcr
    ports:
      - "5432:5432"
    volumes:
      - hcr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcr -d hcr"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hcr_redisdata:/data

volumes:
  hcr_pgdata:
  hcr_redisdata:
